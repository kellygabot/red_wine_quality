[project]
name = "red-wine-quality-app"
version = "0.1.0"
description = "Local Streamlit showcase for a red wine quality model"
readme = "README.md"
authors = [
    { name = "kellygabot", email = "kellygabot3232006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=6.5.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.64.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
